<div class="registro-container">
  <div class="registro-header">
    <h2>Registro API</h2>
    <div class="actions">
      <button class="btn" (click)="refresh()">Actualizar</button>
    </div>
  </div>

  <div *ngIf="error" class="error">{{ error }}</div>

  <div *ngIf="logs && logs.length > 0" class="table-wrap">
    <table class="registro-table" role="table" aria-label="Registro API">
      <thead>
        <tr>
          <th>Fecha y hora</th>
          <th>Tipo</th>
          <th>Mensaje</th>
        </tr>
      </thead>
      <tbody>
  <tr *ngFor="let row of logs" [class.error-row]="row.tipo.toUpperCase() === 'ERROR'">
          <td>{{ row.fechaHora }}</td>
          <td>{{ row.tipo }}</td>
          <td><pre class="log-message">{{ row.message }}</pre></td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="!logs || logs.length === 0" class="empty">No hay registros disponibles.</div>
</div>

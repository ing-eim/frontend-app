<div class="login-bg">
  <form (ngSubmit)="login()" class="login-form">
    <div class="logo-container">
      <img src="assets/DWH.png" alt="Retorno Logístico" class="login-logo">
    </div>
    <h2>Iniciar Sesión</h2>
    <div>
      <label for="username">Usuario</label>
      <input 
        id="username" 
        [(ngModel)]="username" 
        name="username" 
        placeholder="Ingresa tu usuario"
        required />
    </div>
    <div>
      <label for="password">Contraseña</label>
      <input 
        id="password" 
        type="password" 
        [(ngModel)]="password" 
        name="password" 
        placeholder="Ingresa tu contraseña"
        required />
    </div>
    <button type="submit" (click)="testClick(); login($event)">Entrar</button>
    <div *ngIf="error" class="error">{{ error }}</div>
    <div class="version">v{{ version }}</div>
  </form>
</div>

<!-- Modal de Sesión Expirada -->
<div *ngIf="showSessionExpiredModal" class="session-expired-overlay">
  <div class="session-expired-modal">
    <div class="modal-header">
      <div class="warning-icon">⚠️</div>
      <h3>Sesión Expirada</h3>
    </div>
    <div class="modal-body">
      <p>Su sesión ha expirado por inactividad después de 3 minutos.</p>
      <p>Será redirigido al login automáticamente en <strong>{{ countdown }}</strong> segundos.</p>
    </div>
    <div class="modal-footer">
      <button class="modal-btn" (click)="closeSessionExpiredModal()">
        Ir al Login Ahora
      </button>
    </div>
  </div>
</div>

<div class="dashboard-layout">
  <aside class="sidebar" [class.collapsed]="sidebarCollapsed">
    <div class="sidebar-header">
      <h3 *ngIf="!sidebarCollapsed">MENÚ</h3>
      <button class="toggle-btn" (click)="toggleSidebar()" type="button">
        <i class="fas" [class.fa-chevron-left]="!sidebarCollapsed" [class.fa-chevron-right]="sidebarCollapsed"></i>
      </button>
    </div>
    <nav class="sidebar-nav">
      <ul>
        <li>
          <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
            <i class="fas fa-home"></i>
            <span *ngIf="!sidebarCollapsed">Inicio</span>
          </a>
        </li>
        <li class="has-submenu">
          <div class="menu-item" (click)="toggleOperacionesMenu()" [class.active]="operacionesMenuOpen">
            <i class="fas fa-cogs"></i>
            <span *ngIf="!sidebarCollapsed">Operaciones</span>
            <i *ngIf="!sidebarCollapsed" class="fas fa-chevron-down submenu-arrow" [class.rotated]="operacionesMenuOpen"></i>
          </div>
          <ul *ngIf="operacionesMenuOpen && !sidebarCollapsed" class="submenu">
            <li>
              <a routerLink="/dashboard/operaciones/carga-archivos" routerLinkActive="active">
                <i class="fas fa-upload"></i>
                <span>Carga de Archivos</span>
              </a>
            </li>
            <li>
              <a routerLink="/dashboard/operaciones/sincronizacion" routerLinkActive="active">
                <i class="fas fa-sync-alt"></i>
                <span>Sincronización</span>
              </a>
            </li>
          </ul>
        </li>
        <li>
          <a routerLink="/dashboard/reportes" routerLinkActive="active">
            <i class="fas fa-chart-bar"></i>
            <span *ngIf="!sidebarCollapsed">Reportes</span>
          </a>
        </li>
        <li>
          <a routerLink="/dashboard/usuarios" routerLinkActive="active">
            <i class="fas fa-users"></i>
            <span *ngIf="!sidebarCollapsed">Usuarios</span>
          </a>
        </li>
        <li>
          <button (click)="logout()" class="logout-btn">
            <i class="fas fa-sign-out-alt"></i>
            <span *ngIf="!sidebarCollapsed">Cerrar sesión</span>
          </button>
        </li>
      </ul>
    </nav>
  </aside>
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-content">
        <img src="assets/DWH2.png" alt="Logo" class="logo" />
        <div class="user-info" (click)="toggleMenu()" tabindex="0" style="position:relative;cursor:pointer;">
          <span>Usuario: {{ auth.getUsername() }}</span>
          <span class="user-menu-icon"><i class="fas fa-user"></i></span>
          <div *ngIf="menuOpen" class="user-menu">
            <button (click)="logout()">
              <i class="fas fa-sign-out-alt logout-icon"></i> Cerrar sesión
            </button>
            <!-- Puedes agregar más opciones aquí -->
          </div>
        </div>
      </div>
    </header>
    <section class="content">

      <router-outlet></router-outlet>
    </section>
  </div>
</div>

<!-- Modal de Sesión Expirada -->
<div [style.display]="showSessionExpiredModal ? 'flex' : 'none'" class="session-expired-overlay">
  <div class="session-expired-modal">
    <div class="modal-header">
      <div class="warning-icon">⚠️</div>
      <h3>Sesión Expirada</h3>
    </div>
    <div class="modal-body">
      <p>Su sesión ha expirado por inactividad después de 3 minutos.</p>
      <p>Será redirigido al login automáticamente en <strong>{{ countdown }}</strong> segundos.</p>
    </div>
    <div class="modal-footer">
      <button class="modal-btn" (click)="closeSessionExpiredModal()">
        Ir al Login Ahora
      </button>
    </div>
  </div>
</div>

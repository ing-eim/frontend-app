<div class="dashboard-layout">
  <aside class="sidebar" [class.collapsed]="sidebarCollapsed">
    <div class="sidebar-header">
      <h3 *ngIf="!sidebarCollapsed">MENÚ</h3>
      <button class="toggle-btn" (click)="toggleSidebar()" type="button">
        <i class="fas" [class.fa-chevron-left]="!sidebarCollapsed" [class.fa-chevron-right]="sidebarCollapsed"></i>
      </button>
    </div>
    <nav class="sidebar-nav">
      <ul>
        <li>
          <a routerLink="/dashboard/inicio" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
            <i class="fas fa-home"></i>
            <span *ngIf="!sidebarCollapsed">Inicio</span>
          </a>
        </li>

        <li class="has-submenu">
          <!-- Use an anchor so Operaciones visually matches other menu links while still acting as a toggle -->
          <a class="menu-link" role="button" (click)="toggleOperacionesMenu()" [class.active]="operacionesMenuOpen" tabindex="0">
            <i class="fas fa-cogs"></i>
            <span *ngIf="!sidebarCollapsed">Operaciones</span>
            <i *ngIf="!sidebarCollapsed" class="fas fa-chevron-down submenu-arrow" [class.rotated]="operacionesMenuOpen"></i>
          </a>
          <ul *ngIf="operacionesMenuOpen && !sidebarCollapsed" class="submenu">
            <li>
              <a routerLink="/dashboard/operaciones/carga-archivos" routerLinkActive="active">
                <i class="fas fa-upload"></i>
                <span>Carga de Archivos</span>
              </a>
            </li>
            <li>
              <a routerLink="/dashboard/operaciones/sincronizacion" routerLinkActive="active">
                <i class="fas fa-sync-alt"></i>
                <span>Sincronización</span>
              </a>
            </li>
          </ul>
        </li>

        <!--<li>
          <a routerLink="/dashboard/reportes" routerLinkActive="active">
            <i class="fas fa-chart-bar"></i>
            <span *ngIf="!sidebarCollapsed">Reportes</span>
          </a>
        </li>-->

        <li>
          <a routerLink="/dashboard/usuarios" routerLinkActive="active">
            <i class="fas fa-users"></i>
            <span *ngIf="!sidebarCollapsed">Usuarios</span>
          </a>
        </li>

        <li>
          <button (click)="logout()" class="logout-btn">
            <i class="fas fa-sign-out-alt"></i>
            <span *ngIf="!sidebarCollapsed">Cerrar sesión</span>
          </button>
        </li>
      </ul>
    </nav>
  </aside>
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-content">
        <img src="assets/DWH2.png" alt="Logo" class="logo" />
        
        <div class="topbar-right">
          <!-- Panel de Notificaciones en el Topbar -->
          <div class="topbar-notifications">
            <div class="notifications-dropdown" [class.open]="notificationsOpen">
                <button class="notifications-btn" (click)="toggleNotifications()" type="button">
                <i class="fas fa-bell"></i>
                <span class="notifications-badge" *ngIf="hasNotifications">{{notificationsCount}}</span>
              </button>
              
              <div class="notifications-menu" *ngIf="notificationsOpen">
                <div class="notifications-header">
                  <h4>Notificaciones</h4>
                  <span class="notifications-count">{{notificationsCount}} pendientes</span>
                </div>
                <div class="notifications-list">
                  <div class="notification-item" 
                       *ngFor="let notification of pendingNotifications" 
                       [class.urgent]="notification.isUrgent"
                       [class.warning]="notification.isWarning">
                    <div class="notification-icon">
                      <i class="fas" [class.fa-exclamation-triangle]="notification.isUrgent" 
                                    [class.fa-clock]="notification.isWarning"
                                    [class.fa-info-circle]="!notification.isUrgent && !notification.isWarning"></i>
                    </div>
                    <div class="notification-content">
                      <div class="notification-title">{{notification.title}}</div>
                      <div class="notification-message">{{notification.message}}</div>
                      <div class="notification-date">{{notification.dueDate}}</div>
                    </div>
                  </div>
                  <div class="no-notifications" *ngIf="!hasNotifications">
                    <i class="fas fa-check-circle"></i>
                    <span>No hay notificaciones pendientes</span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="user-info" (click)="toggleMenu()" tabindex="0" style="position:relative;cursor:pointer;">
            <span>Usuario: {{ auth.getUsername() }}</span>
            <span class="user-menu-icon"><i class="fas fa-user"></i></span>
            <div *ngIf="menuOpen" class="user-menu">
              <button (click)="logout()">
                <i class="fas fa-sign-out-alt logout-icon"></i> Cerrar sesión
              </button>
              <!-- Puedes agregar más opciones aquí -->
            </div>
          </div>
        </div>
      </div>
    </header>
    <section class="content">

      <router-outlet></router-outlet>

      <!-- Resultado del Excel procesado moved to Operaciones component -->
    </section>
  </div>
</div>

<!-- SessionExpiredModal is mounted at app root; Dashboard does not render it here -->
